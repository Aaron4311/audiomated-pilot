<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Audiomated Pilot logo: an aircraft control yoke rim formed from audio waveform bars">
  <title>Audiomated Pilot logo</title>
  <desc>Dark rounded-square app icon. A control column rises to a set of waveform bars arranged along a gentle downward arc with tilted outer bars, evoking a yoke's curved grip while remaining a clear sound waveform.</desc>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="#0B0E14"/>

  <!-- control column stem -->
  <rect x="243" y="232" width="26" height="128" rx="13" fill="#22D3EE"/>
  <!-- base mount -->
  <rect x="222" y="352" width="68" height="16" rx="8" fill="#22D3EE"/>

  <!-- waveform bars, arcing gently with more tilt at the ends -->
  <g fill="#22D3EE">
    <rect x="144" y="226" width="20" height="76" rx="10" transform="rotate(-14 154 264)"/>
    <rect x="178" y="192" width="20" height="106" rx="10" transform="rotate(-6 188 245)"/>
    <rect x="212" y="204" width="20" height="60" rx="10"/>
    <rect x="246" y="165" width="20" height="130" rx="10"/>
    <rect x="280" y="204" width="20" height="60" rx="10"/>
    <rect x="314" y="192" width="20" height="106" rx="10" transform="rotate(6 324 245)"/>
    <rect x="348" y="226" width="20" height="76" rx="10" transform="rotate(14 358 264)"/>
  </g>
</svg>
